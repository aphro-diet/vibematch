<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vibe Generator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container wrapper">
    <header>
      <h1>Vibe Generator</h1>
      <div class="subtitle">Find your aesthetic, mood, and vibe in seconds</div>
    </header>

    <!-- Upload or Input Section -->
    <div class="upload-section">
      <input type="text" id="inputText" placeholder="Type your mood, theme, or idea..." />
    </div>

    <!-- Vibe Buttons -->
    <div class="vibe-selection">
      <div class="vibe-buttons">
        <button onclick="generateVibe('calm')">Calm</button>
        <button onclick="generateVibe('party')">Party</button>
        <button onclick="generateVibe('romantic')">Romantic</button>
        <button onclick="generateVibe('dark')">Dark</button>
      </div>
    </div>

    <!-- Submit Button -->
    <div class="input-section">
      <button onclick="processInput()">Generate</button>
    </div>

    <!-- Results -->
    <div class="results" id="results">
      <h2>Your Vibe</h2>
      <div class="card-container" id="cardContainer"></div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
